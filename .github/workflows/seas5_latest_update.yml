name: SEAS5 latest monthly update

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "Optional catch-up start year (empty=auto from latest existing file)"
        required: false
        default: ""
      start_month:
        description: "Optional catch-up start month 1-12 (used with start_year)"
        required: false
        default: ""
      force_rebuild_existing:
        description: "Rebuild months even if CSV already exists (true/false)"
        required: false
        default: "false"
      keep_latest_members:
        description: "Also output per-member latest files under SEAS5/latest_members (true/false)"
        required: false
        default: "true"
      backfill_2026_q1:
        description: "One-click backfill for 2026-01..current month with force rebuild (true/false)"
        required: false
        default: "false"
  schedule:
    # ECMWF seasonal real-time release is documented at day 6, 12:00 UTC.
    # Run shortly after release, plus one fallback retry next day.
    - cron: "20 12 6 * *"
    - cron: "0 3 7 * *"
    # Quarterly health-check run (Jan/Apr/Jul/Oct) to ensure seasonal pipeline stays healthy.
    - cron: "30 3 8 1,4,7,10 *"

permissions:
  contents: write

concurrency:
  group: seas5-latest-update
  cancel-in-progress: false

jobs:
  update-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "cdsapi>=0.7.7" xarray netCDF4 numpy pandas matplotlib

      - name: Run latest updater (timeboxed + catch-up)
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}

          LATEST_ROOT: SEAS5/latest
          LATEST_MEMBERS_ROOT: SEAS5/latest_members
          START_YEAR: ${{ github.event_name == 'workflow_dispatch' && (inputs.backfill_2026_q1 == 'true' && '2026' || inputs.start_year) || '' }}
          START_MONTH: ${{ github.event_name == 'workflow_dispatch' && (inputs.backfill_2026_q1 == 'true' && '1' || inputs.start_month) || '' }}
          FORCE_REBUILD_EXISTING: ${{ github.event_name == 'workflow_dispatch' && (inputs.backfill_2026_q1 == 'true' && 'true' || inputs.force_rebuild_existing) || 'false' }}
          KEEP_LATEST_MEMBERS: ${{ github.event_name == 'workflow_dispatch' && inputs.keep_latest_members || 'true' }}

          HORIZON_AHEAD_MONTHS: "4"
          TIME_BUDGET_SEC: "18000"
          STOP_GRACE_SEC: "120"
          DEBUG: "0"
        run: python seas5_update_latest_timeboxed.py


      - name: Generate anomaly validation report
        env:
          TARGET_LAT: "23.0"
          TARGET_LON: "120.0"
          TZ_NAME: "Asia/Taipei"
          VALIDATION_OUT_ROOT: "validation/anomaly_reports"
          CLIM_YEAR_START: "2000"
          CLIM_YEAR_END: "2025"
        run: python validation_generate_anomaly_report.py

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add SEAS5/latest SEAS5/latest_members validation/anomaly_reports seas5_update_latest_timeboxed.py validation_generate_anomaly_report.py .github/workflows/seas5_latest_update.yml || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "data: update SEAS5 latest monthly forecast"
          git push
