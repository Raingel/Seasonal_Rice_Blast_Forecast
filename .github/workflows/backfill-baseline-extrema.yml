name: Backfill baseline RH/WIND extrema

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 */4 * * *" # every 4 hours

permissions:
  contents: write

concurrency:
  group: baseline-extrema-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xarray netcdf4

      - name: Run backfill (timeboxed)
        env:
          BASELINE_ROOT: SEAS5/baseline
          BASELINE_YEAR_MIN: "2000"
          BASELINE_YEAR_MAX: "2025"
          INIT_MONTHS: "1-12"
          TIME_BUDGET_SEC: "18000"   # 5h
          STOP_GRACE_SEC: "120"
          DEBUG: "0"
          KEY_ROUND_DP: "3"
        run: python backfill_baseline_extrema_timeboxed.py

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "data: backfill baseline rh/wind extrema columns"
            git push
          else
            echo "No changes to commit"
          fi
