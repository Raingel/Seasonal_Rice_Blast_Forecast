name: seas5_baseline_timeboxed

on:
  workflow_dispatch:
    inputs:
      baseline_year_min:
        description: "Baseline start year (inclusive)"
        required: false
        default: "2000"
      baseline_year_max:
        description: "Baseline end year (inclusive)"
        required: false
        default: "2025"
  schedule:
    # 每月 7 號 UTC 執行，對齊月初新資料上線後的補抓節奏
    - cron: "0 2 7 * *"

concurrency:
  group: seas5-baseline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "cdsapi>=0.7.7" xarray netCDF4 numpy pandas


      - name: Show resolved parameters
        run: |
          CUR_YEAR="$(date -u +%Y)"
          echo "CUR_YEAR=${CUR_YEAR}" >> "$GITHUB_ENV"
          echo "event=${{ github.event_name }}"
          echo "BASELINE_YEAR_MIN=${{ github.event_name == 'workflow_dispatch' && inputs.baseline_year_min || '2000' }}"
          echo "BASELINE_YEAR_MAX=${{ github.event_name == 'workflow_dispatch' && inputs.baseline_year_max || 'CUR_YEAR(auto)' }}"

      - name: Build baseline (timeboxed)
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}

          # baseline settings (manual trigger can override years)
          BASELINE_YEAR_MIN: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_year_min || '2000' }}
          BASELINE_YEAR_MAX: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_year_max || env.CUR_YEAR }}
          INIT_MONTHS: "1-12"
          HORIZON_AHEAD_MONTHS: "4"
          OUT_ROOT: "SEAS5"

          # timebox (5 hours)
          TIME_BUDGET_SEC: "18000"
          STOP_GRACE_SEC: "180"

          DEBUG: "1"
        run: |
          python seas5_build_monthly_baseline_timeboxed.py

      - name: Validate newly generated baseline CSV schema
        run: |
          python - <<'PY'
          import pandas as pd
          import subprocess
          import sys

          required = ["rh_pct_max", "rh_pct_min", "wind_mps_max", "wind_mps_min"]
          cmd = ["git", "diff", "--name-only", "--", "SEAS5/baseline"]
          changed = [x.strip() for x in subprocess.check_output(cmd, text=True).splitlines() if x.strip()]
          files = [fp for fp in changed if fp.endswith(".csv") and "/init" in fp]
          if not files:
              print("No changed baseline CSV files to validate.")
              sys.exit(0)

          bad = []
          for fp in files:
              cols = list(pd.read_csv(fp, nrows=1).columns)
              miss = [c for c in required if c not in cols]
              if miss:
                  bad.append((fp, miss))
          if bad:
              for fp, miss in bad:
                  print(f"[SCHEMA-FAIL] {fp} missing columns: {miss}")
              sys.exit(1)
          print(f"Schema OK for {len(files)} changed baseline CSV files.")
          PY

      - name: Commit & push changes (if any)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add only data outputs you want tracked
          git add SEAS5/baseline || true

          # If no changes, exit cleanly
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update SEAS5 baseline (timeboxed)"
          git push
