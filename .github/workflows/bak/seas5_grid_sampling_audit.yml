name: SEAS5 grid sampling audit

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Space-separated samples, e.g. 'latest:2026-01 baseline:2025-01 baseline:2011-06'"
        required: false
        default: "latest:2026-01 baseline:2025-01 baseline:2011-06"
      download:
        description: "Download CDS sample for each token (true/false)"
        required: false
        default: "true"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "cdsapi>=0.7.7" xarray netCDF4 numpy pandas

      - name: Run grid sampling audit
        env:
          CDSAPI_URL: ${{ secrets.CDSAPI_URL }}
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          SAMPLES: ${{ inputs.samples }}
          WANT_DOWNLOAD: ${{ inputs.download }}
        run: |
          set -e
          args=""
          for s in $SAMPLES; do
            args="$args --sample $s"
          done
          if [ "$WANT_DOWNLOAD" = "true" ]; then
            args="$args --download"
          fi
          python seas5_grid_sampling_audit.py $args
          cat validation/grid_audit/grid_audit_report.md

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: seas5-grid-audit-report
          path: validation/grid_audit/

      - name: Commit report (if changed)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seas5_grid_sampling_audit.py .github/workflows/seas5_grid_sampling_audit.yml validation/grid_audit || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: add SEAS5 grid sampling audit report"
          git push
