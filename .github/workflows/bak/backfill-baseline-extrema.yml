name: Backfill baseline RH/WIND extrema

on:
  workflow_dispatch: {}
  schedule:
    # 每月 baseline 更新後執行一次，確保舊月份也會補齊極值欄位
    - cron: "0 5 8 * *"

permissions:
  contents: write

concurrency:
  group: baseline-extrema-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xarray netcdf4

      - name: Run backfill (timeboxed)
        env:
          BASELINE_ROOT: SEAS5/baseline
          BASELINE_YEAR_MIN: "2000"
          BASELINE_YEAR_MAX: "2025"
          INIT_MONTHS: "1-12"
          TIME_BUDGET_SEC: "18000"   # 5h
          STOP_GRACE_SEC: "120"
          DEBUG: "0"
          KEY_ROUND_DP: "3"
          LOG_FIRST_N_NO_OVERLAP: "30"
          DIAG_OUT_CSV: "/tmp/no_overlap_diagnostics.csv"
        run: python backfill_baseline_extrema_timeboxed.py

      - name: Show diagnostics preview
        run: |
          if [[ -f /tmp/no_overlap_diagnostics.csv ]]; then
            echo "no_overlap_diagnostics.csv (first 20 lines)"
            head -n 20 /tmp/no_overlap_diagnostics.csv
          else
            echo "No diagnostics file generated"
          fi

      - name: QA baseline extrema schema/content
        env:
          MAX_MISSING_COL_FILES: "0"
          MAX_NULL_EXTREMA_ROWS: "0"
          MAX_BAD_ORDER_ROWS: "0"
          MAX_BAD_RH_RANGE_ROWS: "0"
          MAX_NEG_WIND_ROWS: "0"
          MAX_CONTINUITY_GAP_GROUPS: "0"
          MIN_NEIGHBOR_PAIR_CORR: "0.3"
          MIN_NEIGHBOR_PAIR_COUNT: "10"
        run: python qa_extrema_backfill_check.py

      - name: Commit and push if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "data: backfill baseline rh/wind extrema columns"
            git push
          else
            echo "No changes to commit"
          fi
